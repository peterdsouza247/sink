<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b25"><title>Sink Before Dawn</title><meta name="description" content="Find the moving convoy and sink it before daylight. A hidden-position duel of sonar, evasive maneuvers, and twelve searches."><link rel="stylesheet" href="shared.css"><style>
body{--accent:#f0c777;--blue:#76c8d1;background:radial-gradient(circle at 55% -20%,#325f72,transparent 45%),repeating-linear-gradient(0deg,transparent 0 60px,#5c8c9711 61px 62px),#101b25}.sea{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(100%,560px);aspect-ratio:1;margin:auto;padding:6px;border-radius:14px;background:#0e303d;border:1px solid #53808a}.cell{min-width:0;padding:0;border:1px solid #416c78;border-radius:6px;background:linear-gradient(155deg,#255063,#1e3f50);position:relative;font-family:Outfit,sans-serif;font-size:clamp(12px,2.8vw,23px);font-weight:800}.cell:hover:not(:disabled){background:#3a6b7b}.cell:disabled{opacity:1;cursor:default}.cell.ship{background:#d1a86d;color:#172631;border-color:#ffe0a0}.cell.hit{background:#cf6d58;color:#fff;border-color:#ffa497}.cell.miss{color:#94bcc3}.cell.scan{background:#386a71}.cell.hint{outline:2px solid #f6d68b;outline-offset:-3px}.cell.scan:after{content:'◌';color:#a8e8de}.arena{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:18px}.side .stat{margin-bottom:9px}.coordinate{font-size:11px;color:#afd1d0;position:absolute;left:4px;top:2px}.cell.hit .coordinate,.cell.ship .coordinate{color:#223942}.side .button-row button{width:100%}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}.legend span:before{content:'●';color:var(--blue);margin-right:6px}.legend span:nth-child(2):before{color:var(--red)}.legend span:nth-child(3):before{color:var(--accent)}
@media(max-width:740px){.arena{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side .stat{margin:0}.side .notice,.side .button-row{grid-column:1/-1}.sea{gap:2px;padding:4px}.cell{border-radius:3px}.coordinate{display:none}}
</style></head><body><main id="app"></main><script src="shared.js"></script><script src="game.js"></script></body></html>
