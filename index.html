<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b25"><title>Sink Before Dawn</title><meta name="description" content="Find the moving convoy and sink it before daylight. A hidden-position duel of sonar, evasive maneuvers, and twelve searches."><link rel="stylesheet" href="shared.css"><style>
body{--accent:#f0c777;--blue:#76c8d1;background:radial-gradient(circle at 55% -20%,#325f72,transparent 45%),repeating-linear-gradient(0deg,transparent 0 60px,#5c8c9711 61px 62px),#101b25}.sea{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(100%,560px);aspect-ratio:1;margin:auto;padding:6px;border-radius:14px;background:#0e303d;border:1px solid #53808a;position:relative}.cell{min-width:0;padding:0;border:1px solid #416c78;border-radius:6px;background:linear-gradient(155deg,#255063,#1e3f50);position:relative;font-family:Outfit,sans-serif;font-size:clamp(12px,2.8vw,23px);font-weight:800}.cell:hover:not(:disabled){background:#3a6b7b}.cell:disabled{opacity:1;cursor:default}.cell.ship{background:#d1a86d;color:#172631;border-color:#ffe0a0}.cell.hit{background:#cf6d58;color:#fff;border-color:#ffa497}.cell.miss{color:#94bcc3}.cell.scan{background:#386a71}.cell.scan-area{background:#397487;border-color:#a4ecdd}.cell.hint{outline:2px solid #f6d68b;outline-offset:-3px}.cell .sonar-mark{position:absolute;right:2px;bottom:2px;min-width:18px;line-height:18px;border-radius:50%;background:#e9e4bd;color:#12313e;font-size:11px;box-shadow:0 1px 4px #0a2339}.cell .sonar-mark.contact{background:#f0c777}.arena{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:18px}.side .stat{margin-bottom:9px}.coordinate{font-size:11px;color:#afd1d0;position:absolute;left:4px;top:2px}.cell.hit .coordinate,.cell.ship .coordinate{color:#223942}.side .button-row button{width:100%}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}.legend span:before{content:'●';color:var(--blue);margin-right:6px}.legend span:nth-child(2):before{color:var(--red)}.legend span:nth-child(3):before{color:var(--accent)}
.sonar-report{border:1px solid #89c9c1;background:#173b48;border-radius:10px;padding:10px 12px;margin:10px 0;color:#e3fff5;font-size:13px}.sonar-report strong{display:block;font:700 16px Outfit,sans-serif;color:#fff}.sonar-report.stale{border-color:#698390;color:#c4d6d8}.action-feedback{min-height:48px;margin:12px 0 0;padding:10px 14px;background:#173946;border-left:4px solid var(--blue);border-radius:6px;color:#e7fffa;font-weight:700}.action-feedback.contact,.action-feedback.hit{border-color:var(--accent);background:#38422d;color:#ffe6a4}.action-feedback.clear,.action-feedback.miss{border-color:#6ca7b3}.sonar-pulse{position:absolute;z-index:5;width:37.5%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;filter:drop-shadow(0 0 10px #8beddb)}.sonar-pulse:before,.sonar-pulse:after{content:'';position:absolute;inset:0;border:3px solid #a3f8de;border-radius:50%;animation:sonar-ring 1.1s ease-out both}.sonar-pulse:after{animation-delay:.28s}.sonar-pulse .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 250deg,#91e4d54d 325deg,#c7ffe4bb 360deg);animation:sonar-sweep 1.1s linear both}.shot-pulse{position:absolute;z-index:5;width:12.5%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #ffc676;border-radius:50%;pointer-events:none;animation:sonar-ring .6s ease-out both}.shot-pulse.hit{border-color:#ff876f;box-shadow:0 0 22px #f08166}.sound-toggle{white-space:nowrap}
@keyframes sonar-ring{from{transform:scale(.12);opacity:1}to{transform:scale(1.1);opacity:0}}@keyframes sonar-sweep{from{transform:rotate(-90deg);opacity:.2}to{transform:rotate(270deg);opacity:.85}}
@media(max-width:740px){.arena{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side .stat{margin:0}.side .notice,.side .button-row,.side .sonar-report{grid-column:1/-1}.sea{gap:2px;padding:4px}.cell{border-radius:3px}.coordinate{display:none}}
@media(prefers-reduced-motion:reduce){.sonar-pulse:before,.sonar-pulse:after,.sonar-pulse .sweep,.shot-pulse{animation:none}.sonar-pulse{border:2px solid #a3f8de;background:#91e4d526}.shot-pulse{opacity:.8}}
</style></head><body><main id="app"></main><script src="shared.js"></script><script src="game.js"></script></body></html>
